name: Studentroom Zimmer-Check

on:
  schedule:
    # Alle 5 Minuten (Minimum bei GitHub). Zeiten sind UTC und nicht
    # sekundengenau – Laeufe koennen sich bei Last um einige Minuten verschieben.
    - cron: "*/5 * * * *"
    # 2x/Woche Status-Update (Mo & Do, 07:02 UTC = 09:02 Europe/Zurich Sommer).
    # Minute 2 gewaehlt, damit sich dieser Lauf nicht mit dem 5-Minuten-Takt ueberschneidet.
    - cron: "2 7 * * 1,4"
  workflow_dispatch: {}

# Nur ein Lauf gleichzeitig (verhindert Ueberschneidungen bei kurzer Verzoegerung).
concurrency:
  group: studentroom-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      # Wiederhol-Schutz: zuletzt gemeldeten Stand aus dem Cache holen.
      - name: Zustand laden
        uses: actions/cache/restore@v4
        with:
          path: state
          key: studentroom-state-${{ github.run_id }}
          restore-keys: studentroom-state-

      - name: Zimmer pruefen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: state/seen.json
          # Immer senden bei: manuellem Start (Test) ODER dem 2x/Woche-Status-Lauf.
          # Sonst (5-Minuten-Takt) nur bei einer Aenderung (neues freies Zimmer).
          ALWAYS_NOTIFY: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '2 7 * * 1,4') && '1' || '0' }}
          # Kopfzeile der Nachricht je nach Ausloeser.
          STATUS_NOTE: ${{ github.event_name == 'workflow_dispatch' && '🧪 Testnachricht (manuell ausgelöst)' || (github.event.schedule == '2 7 * * 1,4' && '🟢 Regelmäßiger Status (Mo & Do) – der Bot läuft. Zahlen kannst du unten selbst vergleichen.' || '') }}
        run: python check_studentroom.py

      # Aktuellen Stand fuer den naechsten Lauf sichern.
      - name: Zustand speichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: studentroom-state-${{ github.run_id }}
