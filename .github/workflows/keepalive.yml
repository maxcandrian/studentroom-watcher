name: Keepalive

# GitHub pausiert geplante Workflows automatisch, wenn 60 Tage lang keine
# Repo-Aktivitaet stattfindet. Dieser Job macht 1x im Monat einen leeren
# Commit und haelt den Zeitplan des Zimmer-Checks so dauerhaft aktiv –
# ganz ohne dein Zutun.

on:
  schedule:
    - cron: "17 4 1 * *"   # am 1. jedes Monats
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Leeren Commit erstellen
        run: |
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: Zeitplan aktiv halten"
          git push
